function imgFail(i){if(!i.dataset.s){i.dataset.s=1;i.src="Diwali.gif"}else{i.onerror=null;i.src=ART}}
const $=id=>document.getElementById(id);

let senderName="";
function confirmName(){
  const name=$("nameIn").value.trim();
  if(!name){$("err").textContent="Pehle apna naam likhein.";return false}
  senderName=name;
  $("err").textContent="";
  $("nameOut").textContent=name;
  $("banner").classList.remove("hidden");
  $("nameIn").classList.add("hidden");
  $("err").classList.add("hidden");
  $("nameIn").blur();
  return true;
}
function editName(){
  $("banner").classList.add("hidden");
  $("nameIn").classList.remove("hidden");
  $("err").classList.remove("hidden");
  $("nameIn").focus();
}
function share(){
  if(!$("nameIn").classList.contains("hidden")&&!confirmName())return;
  const n=senderName.toUpperCase();
  let msg="🪙 *शुभ धनतेरस!* 🏺\n\n✨ *"+n+"* ki taraf se aapko aur aapke parivar ko Dhanteras ki hardik shubhkamnayein! भगवान धन्वंतरि और माँ लक्ष्मी आपके जीवन में सुख, समृद्धि और अपार धन-वैभव लाएं! 🙏";
  if(location.protocol.startsWith("http")){
    msg+="\n\n👉 Aap bhi apna wish banayein:\n"+location.origin+location.pathname+"?name="+encodeURIComponent(senderName);
  }
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();confirmName()}});
$("nameIn").addEventListener("input",()=>{$("err").textContent=""});
$("banner").onclick=editName;
$("waBtn").onclick=share;

window.onload=function(){
  try{
    const p=new URLSearchParams(location.search).get("name");
    if(p&&p.trim()){$("nameIn").value=p.trim().slice(0,30);confirmName()}
  }catch(e){}
};

/* Canvas: ripples + rising gold coins/sparkles */
const cv=$("bg"),cx=cv.getContext("2d");
let W,H,ripples=[],parts=[];
function size(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
function ripple(x,y,big){ripples.push({x,y,r:2,max:big?160:90+Math.random()*70,a:.7})}
function spawn(){
  const coin=Math.random()<.4;
  parts.push({x:Math.random()*W,y:H+10,s:coin?5+Math.random()*5:1.5+Math.random()*2.5,v:.4+Math.random()*1.1,ph:Math.random()*6.28,sw:.3+Math.random()*.8,coin,a:.4+Math.random()*.6,rot:Math.random()*6.28});
}
function press(e){const t=e.touches?e.touches[0]:e;ripple(t.clientX,t.clientY,true)}
addEventListener("pointerdown",press);
setInterval(()=>ripple(Math.random()*W,Math.random()*H*.9),1100);
let last=0;
function loop(t){
  cx.clearRect(0,0,W,H);
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=1.6;r.a=.7*(1-r.r/r.max);
    if(r.a<=0){ripples.splice(i,1);continue}
    cx.lineWidth=2;
    cx.strokeStyle="rgba(109,240,255,"+r.a+")";cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.stroke();
    cx.strokeStyle="rgba(255,215,90,"+r.a*.8+")";cx.beginPath();cx.arc(r.x,r.y,r.r*.7,0,6.283);cx.stroke();
  }
  if(t-last>110&&parts.length<90){spawn();last=t}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.y-=p.v;p.ph+=.03;p.x+=Math.sin(p.ph)*p.sw;p.rot+=.05;
    if(p.y<-20){parts.splice(i,1);continue}
    const fade=Math.min(1,p.y/(H*.25))*p.a;
    cx.save();cx.translate(p.x,p.y);
    if(p.coin){
      cx.scale(Math.abs(Math.cos(p.rot))*.8+.2,1);
      cx.fillStyle="rgba(255,196,40,"+fade+")";cx.shadowColor="rgba(255,200,60,.9)";cx.shadowBlur=10;
      cx.beginPath();cx.arc(0,0,p.s,0,6.283);cx.fill();
      cx.strokeStyle="rgba(160,100,0,"+fade+")";cx.lineWidth=1;cx.beginPath();cx.arc(0,0,p.s*.6,0,6.283);cx.stroke();
    }else{
      cx.fillStyle="rgba(255,240,170,"+fade+")";cx.shadowColor="rgba(255,220,90,1)";cx.shadowBlur=8;
      cx.beginPath();cx.arc(0,0,p.s,0,6.283);cx.fill();
    }
    cx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
